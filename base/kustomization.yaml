# expense-config/base/kustomization.yaml
# Unchanged W5 D3 manifests. Overlays rewrite namespace, replicas, image tag,
# and env-specific ConfigMap values without editing these files.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespace / ResourceQuota / LimitRange are platform-owned.
  # AppProject clusterResourceWhitelist is empty (Namespace is cluster-scoped)
  # and namespaceResourceBlacklist denies Quota + LimitRange. CreateNamespace=true
  # on the Application still creates expense-* namespaces.
  # - 00-namespace.yaml
  - 10-expense-api.deployment.yaml
  - 20-expense-api.service.yaml
  - 30-expense-api.configmap.yaml
  - 40-expense-api.secret.yaml
  - 50-expense-api.hpa.yaml
  - 60-expense-api.ingress.yaml
  # ServiceMonitor requires Prometheus Operator CRDs.
  # Re-add here (or in a staging/prod overlay) once the cluster has Prometheus Operator installed.
  # - 60-expense-api.servicemonitor.yaml
