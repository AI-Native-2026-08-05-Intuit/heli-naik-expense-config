# base/50-expense-api.hpa.yaml — SLO-derived HPA (Task 2).
# Scales on expense_inflight_requests via Prometheus Adapter, not CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: expense-api
  labels:
    app.kubernetes.io/name:       expense-api
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    expense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: expense-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric:
          name: expense_inflight_requests
        target:
          type: AverageValue
          averageValue: "10"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 60}]
      selectPolicy: Max
