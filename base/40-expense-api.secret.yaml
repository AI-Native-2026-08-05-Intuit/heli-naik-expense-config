# manifests/40-expense-api.secret.yaml - secret env.
# Use `stringData` (plaintext input; Kubernetes base64-encodes for you)
# NOT `data` (hand-base64). Real credentials are NOT committed here.
#
# Lab / k8s-ci: expense-api runs with SPRING_PROFILES_ACTIVE=k8s (in-memory
# H2). Do NOT add SPRING_DATASOURCE_PASSWORD to this Secret — env vars beat
# profile YAML and would break H2 auth.
#
# Engineers regenerate locally for Postgres-backed dev via:
#   kubectl create secret generic expense-api-secrets \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=$(pwgen -s 24 1) \
#     -n expense-dev --dry-run=client -o yaml \
#     > manifests/40-expense-api.secret.local.yaml
# and apply the .local copy (gitignored).

apiVersion: v1
kind: Secret
metadata:
  name: expense-api-secrets
  namespace: expense-dev
  labels:
    app.kubernetes.io/name: expense-api
type: Opaque
stringData:
  _placeholder: "replace-via-kubectl-create-or-eso"
