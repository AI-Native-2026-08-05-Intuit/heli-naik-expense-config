# manifests/60-expense-api.ingress.yaml - external reach.
# k3d/k3s ships Traefik as its built-in ingress controller; the cluster
# is created with --port "8080:80@loadbalancer", so a curl to
# localhost:8080 with the matching Host header reaches this Ingress.
# Use `ingressClassName` (NOT the deprecated annotation form).

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expense-api
  namespace: expense-dev
  labels:
    app.kubernetes.io/name:       expense-api
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    expense
    app.kubernetes.io/managed-by: kubectl
spec:
  ingressClassName: traefik
  rules:
    - host: expense.dev.uptimecrew.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expense-api
                port: { number: 8080 }
